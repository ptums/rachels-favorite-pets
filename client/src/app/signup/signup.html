<div class="jumbotron auth-card">
  <h1 class="h3 mb-4">Create an account</h1>

  @if (error(); as message) {
    <div class="alert alert-danger" role="alert">{{ message }}</div>
  }

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="mb-3">
      <label for="signup-username" class="form-label">Username</label>
      <input
        id="signup-username"
        class="form-control"
        formControlName="username"
        autocomplete="username"
        autocapitalize="none"
        spellcheck="false"
        required
        [attr.aria-invalid]="form.controls.username.touched && form.controls.username.invalid"
        aria-describedby="signup-username-hint"
      />
      <p id="signup-username-hint" [class]="form.controls.username.touched && form.controls.username.invalid ? 'invalid-feedback d-block' : 'form-text'">
        3 to 32 characters: letters, numbers, - or _.
      </p>
    </div>

    <div class="mb-3">
      <label for="signup-password" class="form-label">Password</label>
      <input
        id="signup-password"
        class="form-control"
        type="password"
        formControlName="password"
        autocomplete="new-password"
        required
        [attr.aria-invalid]="form.controls.password.touched && form.controls.password.invalid"
        aria-describedby="signup-password-hint"
      />
      <p id="signup-password-hint" [class]="form.controls.password.touched && form.controls.password.invalid ? 'invalid-feedback d-block' : 'form-text'">
        At least {{ minPasswordLength }} characters.
      </p>
    </div>

    <button type="submit" class="btn btn-primary w-100" [disabled]="submitting()">
      {{ submitting() ? 'Creating account…' : 'Sign up' }}
    </button>
  </form>

  <p class="mt-3 mb-0">Already have an account? <a routerLink="/login">Log in</a>.</p>
</div>
